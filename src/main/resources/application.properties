spring.application.name=be-management-hasil-panen
server.port=${PORT:${SERVER_PORT:8082}}

# Data source
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:hasilpanendb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# Hibernate / migration
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Multipart
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:40MB}

# Auth
jwt.secret=${JWT_SECRET:thisIsMysecregtfrdesww233eggtffeeddgkjjhhtdhttebd54ndhdhfhhhshs8877465sbbdd}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
auth.service.base-url=${AUTH_SERVICE_BASE_URL:http://localhost:8080}
auth.service.internal-token=${AUTH_INTERNAL_SERVICE_TOKEN:dev-internal-token}

# External integrations
kebun.service.base-url=${KEBUN_SERVICE_BASE_URL:http://localhost:8081}
payment.service.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8083}
payroll.endpoint=${PAYROLL_ENDPOINT:/api/payroll/harvest-events}
payment.service.auth-token=${PAYMENT_SERVICE_AUTH_TOKEN:}
integration.client.timeout-ms=${INTEGRATION_CLIENT_TIMEOUT_MS:3000}
payroll.outbox.publish-delay-ms=${PAYROLL_OUTBOX_PUBLISH_DELAY_MS:5000}

# Storage
storage.provider=${STORAGE_PROVIDER:local}
storage.local-root=${LOCAL_STORAGE_ROOT:uploads}
storage.max-upload-size-mb=${MAX_UPLOAD_SIZE_MB:5}
storage.allowed-content-types=${ALLOWED_UPLOAD_CONTENT_TYPES:image/jpeg,image/png,image/webp}
storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
