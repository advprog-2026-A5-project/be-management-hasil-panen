name: CI/CD Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write
  id-token: write
  actions: read

jobs:
  build-and-test:
    name: Build, Test, and Package
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run integration tests
        run: ./gradlew --no-daemon test --tests "id.ac.ui.cs.advprog.hasilpanen.integration.*"

      - name: Run unit tests and coverage
        run: ./gradlew --no-daemon test jacocoTestReport

      - name: Build boot JAR
        run: ./gradlew --no-daemon bootJar

      - name: Resolve deployable JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail

          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)"

          if [ -z "${JAR_PATH}" ]; then
            echo "No deployable JAR found in build/libs"
            ls -la build/libs || true
            exit 1
          fi

          echo "jar_path=${JAR_PATH}" >> "${GITHUB_OUTPUT}"
          echo "Resolved deployable JAR: ${JAR_PATH}"

      - name: Upload Spring Boot JAR
        uses: actions/upload-artifact@v4
        with:
          name: hasil-panen-spring-boot-jar
          path: ${{ steps.jar.outputs.jar_path }}

      - name: Upload JaCoCo XML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: ignore

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

    steps:
      - name: Check whether SonarCloud is configured
        id: sonar-check
        shell: bash
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "SonarCloud is not configured. Skipping SonarCloud analysis."
          else
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "SonarCloud is configured."
          fi

      - name: Checkout repository
        if: steps.sonar-check.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        if: steps.sonar-check.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        if: steps.sonar-check.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        if: steps.sonar-check.outputs.enabled == 'true'
        run: chmod +x ./gradlew

      - name: Run SonarCloud analysis
        if: steps.sonar-check.outputs.enabled == 'true'
        run: ./gradlew --no-daemon clean test jacocoTestReport sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-analysis:
    name: Backend Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Analyze backend
        run: ./gradlew --no-daemon test jacocoTestReport bootJar

      - name: Upload SpotBugs SARIF
        if: ${{ always() && hashFiles('build/reports/spotbugs/main.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ github.workspace }}/build/reports/spotbugs/main.sarif
          category: spotbugs-backend

      - name: JaCoCo PR Report
        if: github.event_name == 'pull_request'
        uses: Madrapps/jacoco-report@v1.7.2
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          title: Backend Test Coverage

  security-analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard analysis
        uses: ossf/scorecard-action@v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload Scorecard to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: scorecards

  deploy-aws:
    name: Deploy Hasil Panen to EC2
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - sonarcloud
      - backend-analysis

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download Spring Boot JAR
        uses: actions/download-artifact@v4
        with:
          name: hasil-panen-spring-boot-jar
          path: build/libs

      - name: Resolve downloaded JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail

          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)"

          if [ -z "${JAR_PATH}" ]; then
            echo "No deployable JAR found after artifact download"
            ls -la build/libs || true
            exit 1
          fi

          echo "jar_path=${JAR_PATH}" >> "${GITHUB_OUTPUT}"
          echo "Resolved deployable JAR: ${JAR_PATH}"

      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload JAR to EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          JAR_PATH: ${{ steps.jar.outputs.jar_path }}
        run: |
          set -euo pipefail

          scp -i ~/.ssh/ec2_key.pem "${JAR_PATH}" "${EC2_USER}@${EC2_HOST}:/tmp/hasil-panen-app.jar"

      - name: Deploy and verify on EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          SERVICE_NAME: ${{ secrets.EC2_SERVICE_NAME }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/ec2_key.pem "${EC2_USER}@${EC2_HOST}" \
            "APP_DIR='${APP_DIR}' SERVICE_NAME='${SERVICE_NAME}' bash -s" << 'REMOTE_SCRIPT'
          set -euo pipefail

          sudo mkdir -p "${APP_DIR}"
          sudo install -m 644 /tmp/hasil-panen-app.jar "${APP_DIR}/app.jar"
          rm -f /tmp/hasil-panen-app.jar

          if ! sudo systemctl restart "${SERVICE_NAME}"; then
            sudo journalctl -u "${SERVICE_NAME}" -n 100 --no-pager || true
            exit 1
          fi

          if ! sudo systemctl is-active --quiet "${SERVICE_NAME}"; then
            sudo systemctl --no-pager --full status "${SERVICE_NAME}" || true
            sudo journalctl -u "${SERVICE_NAME}" -n 100 --no-pager || true
            exit 1
          fi

          sudo systemctl --no-pager --full status "${SERVICE_NAME}" | head -n 20 || true

          echo "Checking health endpoint..."
          curl -fsS http://localhost:8082/actuator/health

          echo "Checking prometheus endpoint..."
          curl -fsS http://localhost:8082/actuator/prometheus > /dev/null

          echo "Deployment successful."
          REMOTE_SCRIPT

  deploy-monitoring:
    name: Deploy Prometheus and Grafana
    runs-on: ubuntu-latest
    needs: deploy-aws

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy monitoring stack to EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/ec2_key.pem "${EC2_USER}@${EC2_HOST}" << 'REMOTE_SCRIPT'
          set -euo pipefail

          sudo dnf install -y docker
          sudo systemctl enable docker
          sudo systemctl start docker

          sudo mkdir -p /opt/mysawit-hasil-panen-monitoring/grafana/provisioning/datasources
          sudo mkdir -p /opt/mysawit-hasil-panen-monitoring/grafana/provisioning/dashboards
          sudo mkdir -p /opt/mysawit-hasil-panen-monitoring/grafana/dashboards
          sudo chown -R ec2-user:ec2-user /opt/mysawit-hasil-panen-monitoring

          cat > /opt/mysawit-hasil-panen-monitoring/prometheus.yml << 'PROMETHEUS_CONFIG'
          global:
            scrape_interval: 5s

          scrape_configs:
            - job_name: "hasil-panen-service"
              metrics_path: "/actuator/prometheus"
              static_configs:
                - targets: ["host.docker.internal:8082"]
          PROMETHEUS_CONFIG

          cat > /opt/mysawit-hasil-panen-monitoring/grafana/provisioning/datasources/prometheus.yml << 'GRAFANA_DATASOURCE'
          apiVersion: 1

          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true
          GRAFANA_DATASOURCE

          cat > /opt/mysawit-hasil-panen-monitoring/grafana/provisioning/dashboards/dashboards.yml << 'GRAFANA_DASHBOARD_PROVIDER'
          apiVersion: 1

          providers:
            - name: MySawit Hasil Panen
              orgId: 1
              folder: MySawit
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards
          GRAFANA_DASHBOARD_PROVIDER

          cat > /opt/mysawit-hasil-panen-monitoring/grafana/dashboards/hasil-panen-dashboard.json << 'GRAFANA_DASHBOARD'
          {
            "uid": "mysawit-hasil-panen",
            "title": "MySawit Hasil Panen Monitoring",
            "schemaVersion": 38,
            "version": 1,
            "refresh": "5s",
            "panels": [
              {
                "type": "timeseries",
                "title": "Hasil Panen Request Rate",
                "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "sum(rate(http_server_requests_seconds_count{job=\"hasil-panen-service\"}[1m]))",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Hasil Panen 500 Error Rate",
                "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "sum(rate(http_server_requests_seconds_count{job=\"hasil-panen-service\",status=\"500\"}[1m]))",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Hasil Panen JVM Memory Used",
                "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "sum(jvm_memory_used_bytes{job=\"hasil-panen-service\"})",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Hasil Panen CPU Usage",
                "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "process_cpu_usage{job=\"hasil-panen-service\"}",
                    "refId": "A"
                  }
                ]
              }
            ]
          }
          GRAFANA_DASHBOARD

          cat > /opt/mysawit-hasil-panen-monitoring/docker-compose.monitoring.yml << 'DOCKER_COMPOSE'
          services:
            prometheus:
              image: prom/prometheus:latest
              container_name: mysawit-hasil-panen-prometheus
              restart: unless-stopped
              ports:
                - "9090:9090"
              extra_hosts:
                - "host.docker.internal:host-gateway"
              volumes:
                - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
                - prometheus-data:/prometheus
              command:
                - "--config.file=/etc/prometheus/prometheus.yml"

            grafana:
              image: grafana/grafana:latest
              container_name: mysawit-hasil-panen-grafana
              restart: unless-stopped
              ports:
                - "3001:3000"
              environment:
                - GF_SECURITY_ADMIN_USER=admin
                - GF_SECURITY_ADMIN_PASSWORD=admin
              volumes:
                - grafana-data:/var/lib/grafana
                - ./grafana/provisioning:/etc/grafana/provisioning:ro
                - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
              depends_on:
                - prometheus

          volumes:
            prometheus-data:
            grafana-data:
          DOCKER_COMPOSE

          cd /opt/mysawit-hasil-panen-monitoring

          if docker compose version >/dev/null 2>&1; then
            docker compose -f docker-compose.monitoring.yml up -d
          else
            sudo curl -L "https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            docker-compose -f docker-compose.monitoring.yml up -d
          fi

          sleep 10

          curl -f http://localhost:9090/-/ready
          docker ps
          REMOTE_SCRIPT